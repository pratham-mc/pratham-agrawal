//  Context menu
// ══════════════════════════════════════════
function showCtx(e, fileId) {
  const menu = document.getElementById('ctx-menu');
  const overlay = document.getElementById('ctx-overlay');

  const plItems = S.playlists.length
    ? S.playlists.map(pl => `
        <div class="ctx-item" role="menuitem" onclick="closeCtx();addToPlaylist('${pl.id}','${fileId}')">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          ${esc(pl.name)}
        </div>`).join('')
    : `<div class="ctx-item" style="color:var(--muted);cursor:default;font-size:.78rem">No playlists yet</div>`;

  menu.innerHTML = `
    <div class="ctx-section">Add to Playlist</div>
    ${plItems}
    <div class="ctx-divider"></div>
    <div class="ctx-item" role="menuitem" onclick="closeCtx();createPlaylist('${fileId}')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      New playlist…
    </div>
  `;

  const x = Math.min(e.clientX, window.innerWidth - 220);
  const y = Math.min(e.clientY, window.innerHeight - (S.playlists.length * 40 + 120));
  menu.style.left = x + 'px';
  menu.style.top  = y + 'px';
  menu.style.display = 'block';
  overlay.style.display = 'block';
}

function closeCtx() {
  document.getElementById('ctx-menu').style.display = 'none';
  document.getElementById('ctx-overlay').style.display = 'none';
}

// ══════════════════════════════════════════
//  Playback — Audio
// ══════════════════════════════════════════
function playFile(id, listIdx) {
  const f = S.files.find(x => x.id === id);
  if (!f) return;
  if (f.type === 'video') { openVideo(id, noExt(f.name)); return; }
  S.current = f;
  const pool = filtered(S.audio);
  S.queue = pool;
  S.qi = listIdx != null ? listIdx : pool.findIndex(x => x.id === id);
  if (S.qi < 0) S.qi = 0;
  aud.src = `/stream/${id}`; aud.play(); S.playing = true;
  syncPlayerUI(f); render();
  if (!S.meta[id]) fetchMeta(f);
}

function togglePlay() {
  if (!S.current) return;
  if (aud.paused) aud.play(); else aud.pause();
}

function nextTrack() {
  if (!S.queue.length) return;
  let ni;
  if (S.shuffle) ni = Math.floor(Math.random() * S.queue.length);
  else { ni = S.qi + 1; if (ni >= S.queue.length) { if (S.repeat==='all') ni=0; else return; } }
  playQueued(ni);
}

// Play position i of the current queue without rebuilding it (keeps playlists and AI mixes in order).
function playQueued(i) {
  const f = S.queue[i];
  if (!f) return;
  S.qi = i; S.current = f;
  aud.src = `/stream/${f.id}`; aud.play().catch(() => {}); S.playing = true;
  syncPlayerUI(f); render();
  if (!S.meta[f.id]) fetchMeta(f);
}

function prevTrack() {
  if (!S.queue.length) return;
  if (aud.currentTime > 3) { aud.currentTime = 0; return; }
  let pi = S.qi - 1;
  if (pi < 0) pi = S.repeat==='all' ? S.queue.length-1 : 0;
  playQueued(pi);
}

function toggleShuffle() { S.shuffle = !S.shuffle; syncShuf(); savePrefs(); }

function toggleRepeat() {
  S.repeat = {none:'all',all:'one',one:'none'}[S.repeat];
  syncRep(); savePrefs();
}

function toggleMute() {
  S.muted = !S.muted; aud.muted = S.muted;
  syncVolIcon();
}

function seekClick(e) {
  const b = document.getElementById('prog').getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - b.left) / b.width));
  if (aud.duration) aud.currentTime = pct * aud.duration;
}

function setVolClick(e) {
  const b = document.getElementById('vol-bar').getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - b.left) / b.width));
  S.volume = pct; aud.volume = pct;
  S.muted = pct === 0; aud.muted = S.muted;
  syncVolUI(); syncVolIcon(); savePrefs();
}

function wireAudio() {
  aud.addEventListener('timeupdate', () => {
    if (!aud.duration) return;
    const p = (aud.currentTime / aud.duration) * 100;
    document.getElementById('prog-fill').style.width = p + '%';
    document.getElementById('prog-dot').style.left  = p + '%';
    document.getElementById('cur-t').textContent = fmtTime(aud.currentTime);
  });
  aud.addEventListener('loadedmetadata', () => {
    document.getElementById('tot-t').textContent = fmtTime(aud.duration);
  });
  aud.addEventListener('play',  () => { S.playing=true;  syncPP(); startOrbViz(); acquireWakeLock(); });
  aud.addEventListener('pause', () => { S.playing=false; syncPP(); releaseWakeLock(); });
  aud.addEventListener('ended', () => {
    if (S.repeat==='one') { aud.currentTime=0; aud.play(); } else nextTrack();
  });
  aud.addEventListener('error', () => { toast('Error playing file'); nextTrack(); });
}

// ── Keep the system awake while music plays (Screen Wake Lock API) ──
let _wakeLock = null;
async function acquireWakeLock() {
  if (!('wakeLock' in navigator) || _wakeLock) return;
  try {
    _wakeLock = await navigator.wakeLock.request('screen');
    _wakeLock.addEventListener('release', () => { _wakeLock = null; });
  } catch (_) { _wakeLock = null; }   // e.g. tab not visible / not allowed
}
async function releaseWakeLock() {
  try { if (_wakeLock) await _wakeLock.release(); } catch (_) {}
  _wakeLock = null;
}
// The OS auto-releases the lock when the tab is hidden — re-acquire when it
// comes back to the foreground while music is still playing.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.playing) acquireWakeLock();
});

// ── Audio-reactive orb (Web Audio analyser) ──
let _actx, _analyser, _srcNode, _freqData, _vizRAF, _vizLevel = 0;

function ensureAudioGraph() {
  if (_actx) return true;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    _actx = new AC();
    _srcNode = _actx.createMediaElementSource(aud);
    _analyser = _actx.createAnalyser();
    _analyser.fftSize = 256;
    _analyser.smoothingTimeConstant = 0.78;
    _srcNode.connect(_analyser);
    _analyser.connect(_actx.destination);   // keep audio audible
    _freqData = new Uint8Array(_analyser.frequencyBinCount);
    return true;
  } catch (e) {
    _actx = null;               // fall back: audio still plays normally
    return false;
  }
}

function startOrbViz() {
  if (!ensureAudioGraph()) return;
  if (_actx.state === 'suspended') _actx.resume();
  if (!_vizRAF) vizTick();
}

function vizTick() {
  _vizRAF = requestAnimationFrame(vizTick);
  const floatEl = document.getElementById('hero-orb-float');

  let target = 0;
  if (_analyser && S.playing) {
    _analyser.getByteFrequencyData(_freqData);
    // weight the low/low-mid bins (kick + bass) so the orb pulses to the beat
    const bins = Math.min(28, _freqData.length);
    let sum = 0, wsum = 0;
    for (let i = 0; i < bins; i++) {
      const w = 1 - i / bins;      // more weight to lower frequencies
      sum += _freqData[i] * w; wsum += w;
    }
    target = (sum / wsum) / 255;   // 0..1
    target = Math.min(1, target * 1.35);
  }

  // smooth toward target (and decay to 0 when paused)
  _vizLevel += (target - _vizLevel) * (target > _vizLevel ? 0.5 : 0.12);
  if (_vizLevel < 0.001) _vizLevel = 0;

  if (floatEl) {
    floatEl.style.setProperty('--beat', _vizLevel.toFixed(3));
    floatEl.style.transform = 'scale(' + (1 + _vizLevel * 0.11).toFixed(3) + ')';
  }

  // stop the loop once things go quiet and playback is stopped
  if (!S.playing && _vizLevel === 0) {
    cancelAnimationFrame(_vizRAF); _vizRAF = null;
    if (floatEl) floatEl.style.transform = '';
  }
}

// ── Sync UI ───────────────────────────────
function syncPlayerUI(f) {
  const m = S.meta[f.id] || {};
  document.getElementById('pl-title').textContent  = m.title  || noExt(f.name);
  document.getElementById('pl-artist').textContent = m.artist || '–';
  const artEl = document.getElementById('pl-art');
  if (m.hasArtwork) {
    artEl.style.background = '';
    artEl.innerHTML = '';
    const img = document.createElement('img');
    img.src = `/api/artwork/${f.id}`;
    img.alt = '';
    img.onerror = () => { artEl.innerHTML = SVG.music; artEl.style.background = grad(f.id); };
    artEl.appendChild(img);
  } else {
    artEl.innerHTML = SVG.music;
    artEl.style.background = grad(f.id);
  }
  syncPP();
}

function syncPP() {
  document.getElementById('pp-icon').outerHTML = S.playing
    ? `<svg id="pp-icon" viewBox="0 0 24 24" fill="#0F0F23" stroke="none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`
    : `<svg id="pp-icon" viewBox="0 0 24 24" fill="#0F0F23" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
  const orbEl = document.getElementById('hero-orb');
  if (orbEl) orbEl.classList.toggle('playing', !!S.playing);
  const floatEl = document.getElementById('hero-orb-float');
  if (floatEl) floatEl.classList.toggle('playing-green', !!S.playing);
  // sphere-mode play button
  const spBtn = document.getElementById('sphere-play');
  if (spBtn) {
    spBtn.classList.toggle('playing', !!S.playing);
    spBtn.innerHTML = S.playing ? SVG.pause : SVG.play;
  }
  // generic hint only in glow mode (sphere hint tracks the front cover)
  if (S.orbMode !== 'sphere') {
    const hint = document.querySelector('.hero-orb-hint');
    if (hint && S.current) hint.textContent = (S.meta[S.current.id] || {}).title || noExt(S.current.name);
  }
}

function syncShuf() {
  document.getElementById('shuf-btn').classList.toggle('on', S.shuffle);
}

function syncRep() {
  const b = document.getElementById('rep-btn');
  b.classList.toggle('on', S.repeat !== 'none');
  const t = S.repeat === 'one' ? 'Repeat One' : S.repeat === 'all' ? 'Repeat All' : 'Repeat';
  b.title = t; b.setAttribute('aria-label', t);
}

function syncVolUI() {
  document.getElementById('vol-fill').style.width = (S.volume * 100) + '%';
}

function syncVolIcon() {
  const el = document.getElementById('vol-icon');
  if (S.muted || S.volume === 0) {
    el.outerHTML = `<svg id="vol-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`;
  } else if (S.volume < 0.5) {
    el.outerHTML = `<svg id="vol-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;
  } else {
    el.outerHTML = `<svg id="vol-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;
  }
}

// ══════════════════════════════════════════
//  Video modal
// ══════════════════════════════════════════
function openVideo(id, title) {
  aud.pause();
  vid.src = `/stream/${id}`;
  document.getElementById('vid-label').textContent = title;
  document.getElementById('vid-modal').classList.add('open');
  vid.play();
}

function closeVideo() {
  vid.pause(); vid.src = '';
  document.getElementById('vid-modal').classList.remove('open');
}

// ══════════════════════════════════════════
//  Keyboard shortcuts
// ══════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space')     { e.preventDefault(); togglePlay(); }
  if (e.code === 'KeyS')      toggleShuffle();
  if (e.code === 'KeyR')      toggleRepeat();
  if (e.code === 'KeyM')      toggleMute();
  if (e.code === 'Escape')    { closeVideo(); closeCtx(); }
  if (e.code === 'ArrowRight' && e.altKey)  nextTrack();
  if (e.code === 'ArrowLeft'  && e.altKey)  prevTrack();
  if (e.code === 'ArrowRight' && !e.altKey && aud.duration) aud.currentTime = Math.min(aud.duration, aud.currentTime+10);
  if (e.code === 'ArrowLeft'  && !e.altKey && aud.duration) aud.currentTime = Math.max(0, aud.currentTime-10);
});

// ══════════════════════════════════════════
//  Electron global media key bridge
// ══════════════════════════════════════════
if (window.electron?.onMediaKey) {
  window.electron.onMediaKey(key => {
    if (key === 'playpause') togglePlay();
    else if (key === 'next') nextTrack();
    else if (key === 'prev') prevTrack();
  });
}

// ══════════════════════════════════════════
//  Utilities
// ══════════════════════════════════════════
async function api(url, method='GET', body) {
  const opts = { method, headers: {} };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(url, opts);
  return r.json();
}

let toastTmr;
function toast(msg, ms=3000) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTmr);
  toastTmr = setTimeout(() => el.classList.remove('show'), ms);
}

function fmtTime(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

function fmtSize(b) {
  if (!b) return '';
  if (b < 1e6)  return (b/1e3).toFixed(1)+' KB';
  if (b < 1e9)  return (b/1e6).toFixed(1)+' MB';
  return (b/1e9).toFixed(1)+' GB';
}

function noExt(n) { return n.replace(/\.[^/.]+$/, ''); }

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function grad(s) {
  const palettes = [
    ['#4338CA','#7C3AED'],['#0EA5E9','#6366F1'],['#EC4899','#8B5CF6'],
    ['#14B8A6','#3B82F6'],['#F59E0B','#EF4444'],['#10B981','#0EA5E9'],
    ['#8B5CF6','#EC4899'],['#F97316','#EF4444'],['#6366F1','#14B8A6'],
    ['#22C55E','#0EA5E9'],['#A855F7','#EC4899'],['#F59E0B','#22C55E'],
  ];
  let h = 0;
  for (let i = 0; i < s.length; i++) h = s.charCodeAt(i) + ((h<<5)-h);
  const [c1,c2] = palettes[Math.abs(h) % palettes.length];
  return `linear-gradient(135deg,${c1},${c2})`;
}

// ══════════════════════════════════════════
//  Velaris WebGL background
// ══════════════════════════════════════════
(function initVelaris() {
  const VERT = `
    attribute vec2 position;
    varying vec2 vUv;
    void main() {
      vUv = position * 0.5 + 0.5;
      gl_Position = vec4(position, 0.0, 1.0);
    }`;
  const FRAG = `
    precision highp float;
    varying vec2 vUv;
    uniform vec2  u_resolution;
    uniform float u_time;
    uniform float u_grain;
    uniform vec3  u_colors[4];
    uniform vec3  u_bg;
    vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
    float snoise(vec2 v){
      const vec4 C = vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);
      vec2 i  = floor(v + dot(v, C.yy));
      vec2 x0 = v - i + dot(i, C.xx);
      vec2 i1 = (x0.x > x0.y) ? vec2(1.0,0.0) : vec2(0.0,1.0);
      vec4 x12 = x0.xyxy + C.xxzz;
      x12.xy -= i1;
      i = mod(i, 289.0);

// ── album-sphere integration ──
let _infMenu=null, _sphereCanvas=null, _sphereSig='', _sphereItems=[], _sphereActive=null;
const _coverCache={};

function sphereCoverURL(id, title, hue){
  if(_coverCache[id]) return _coverCache[id];
  const c=document.createElement('canvas'); c.width=c.height=512; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,512,512);
  g.addColorStop(0,`hsl(${hue} 70% 58%)`); g.addColorStop(0.6,`hsl(${(hue+42)%360} 62% 38%)`); g.addColorStop(1,`hsl(${(hue+80)%360} 55% 22%)`);
  x.fillStyle=g; x.fillRect(0,0,512,512);
  x.fillStyle='rgba(255,255,255,0.9)'; x.font='700 70px Inter, system-ui, sans-serif'; x.textBaseline='middle'; x.fillText('♪',40,80);
  x.font='700 44px Inter, system-ui, sans-serif';
  const words=(title||'').split(' '); let line='',y=300; const lines=[];
  for(const w of words){ if((line+w).length>10){lines.push(line);line=w+' ';} else line+=w+' '; } lines.push(line);
  lines.slice(0,4).forEach((ln,i)=>x.fillText(ln.trim(),40,y+i*54));
  return _coverCache[id]=c.toDataURL();
}
function hueFromId(id){ let h=0; const s=String(id); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%360; return h; }

function buildSphereItems(){
  return S.audio.map(f=>{
    const m=S.meta[f.id]||{};
    const title=m.title||noExt(f.name);
    const hue=hueFromId(f.id);
    const image = (m.hasArtwork===true) ? `/api/artwork/${f.id}`
                : (m.hasArtwork===false) ? sphereCoverURL(f.id,title,hue)
                : `/api/artwork/${f.id}`;      // unknown → try artwork, fallback fills on error
    return { id:f.id, title, description:(m.artist||''), image, hue };
  });
}

function afterRender(){
  const showSphere = (S.view==='home' && S.orbMode==='sphere' && S.audio.length && window.__sphereOK);
  if(showSphere) ensureSphere();
  else if(S.view!=='home') disposeSphere();
  if(S.view==='mood') msAfterRender();
}

function ensureSphere(){
  const mount=document.getElementById('sphere-mount');
  if(!mount) return;
  const sig=S.audio.map(f=>f.id).join(',');
  if(!_infMenu || sig!==_sphereSig){
    disposeSphere();
    _sphereSig=sig;
    _sphereItems=buildSphereItems();
    _sphereCanvas=document.createElement('canvas');
    _sphereCanvas.id='infinite-grid-menu-canvas';
    mount.appendChild(_sphereCanvas);
    try{ _infMenu=new window.__InfiniteGridMenu(_sphereCanvas,_sphereItems,_sphereOnActive,_sphereOnMove,sk=>sk.run()); }
    catch(e){ console.error('sphere init failed',e); _infMenu=null; }
  } else {
    if(_sphereCanvas.parentElement!==mount) mount.appendChild(_sphereCanvas);
    _infMenu.resize();
  }
}
function disposeSphere(){
  if(_infMenu){ try{_infMenu.dispose();}catch(_){} _infMenu=null; }
  if(_sphereCanvas && _sphereCanvas.parentElement) _sphereCanvas.remove();
  _sphereCanvas=null; _sphereSig='';
}
function _sphereOnActive(i){
  _sphereActive=_sphereItems[i%_sphereItems.length]||null;
  const h=document.getElementById('sphere-hint');
  if(h && _sphereActive) h.textContent=_sphereActive.title;
}
function _sphereOnMove(moving){
  const h=document.getElementById('sphere-hint');
  if(h) h.style.opacity = moving ? '0.45' : '1';
}
function spherePlay(){
  if(!_sphereActive) return;
  if(S.current && S.current.id===_sphereActive.id) togglePlay();
  else playFile(_sphereActive.id);
}

// ── Listening (analysis) ──
let _msWorker, _msJob = 0;
const _msJobs = new Map();
function msWorker() {
  if (_msWorker !== undefined) return _msWorker;
  try {
    const src = `const MoodAI=(${MoodAICore.toString()})();onmessage=e=>{const d=e.data;try{postMessage({id:d.id,features:MoodAI.extractFeatures(d.samples,d.sr)})}catch(err){postMessage({id:d.id,error:String((err&&err.message)||err)})}};`;
    _msWorker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    _msWorker.onmessage = e => {
      const j = _msJobs.get(e.data.id); if (!j) return;
      _msJobs.delete(e.data.id); clearTimeout(j.timer);
      if (e.data.error) j.fail(e.data.error); else j.done(e.data.features);
    };
    _msWorker.onerror = () => {
      _msWorker = null;
      for (const j of _msJobs.values()) { clearTimeout(j.timer); j.crash(); }
      _msJobs.clear();
    };
  } catch (_) { _msWorker = null; }
  return _msWorker;
}
// Runs feature extraction in a background thread so the UI stays smooth; falls back to the main thread.
function msExtract(samples, sr) {
  const local = () => MoodAI.extractFeatures(samples, sr);
  const w = msWorker();
  if (!w) return Promise.resolve().then(local);
  return new Promise((resolve, reject) => {
    const id = ++_msJob;
    const crash = () => { try { resolve(local()); } catch (e) { reject(e); } };
    const timer = setTimeout(() => { _msJobs.delete(id); crash(); }, 30000);
    _msJobs.set(id, { timer, done: resolve, fail: msg => reject(new Error(msg)), crash });
    w.postMessage({ id, samples, sr });
  });
}
// 45 s mono window starting ~30% into the song (skips intros).
function msWindow(buf) {
  const sr = buf.sampleRate, len = buf.length, n = Math.min(len, Math.round(45 * sr));
  const start = len > n ? Math.round(Math.min(len - n, len * 0.3)) : 0;
  const out = new Float32Array(n), ch = buf.numberOfChannels;
  for (let c = 0; c < ch; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < n; i++) out[i] += d[start + i] / ch;
  }
  return out;
}
async function msAnalyze(force) {
  if (MS.analyzing) return;
  const list = S.audio.filter(f => force || !MS.feats[f.id]);
  if (!list.length) { toast('MoodSense has already listened to every song'); return; }
  const AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!AC) { toast('This browser cannot analyse audio — please use Chrome'); return; }
  MS.analyzing = true; MS.prog = { done: 0, total: list.length, current: '' };
  if (S.view === 'mood') render();
  const actx = new AC(1, 1, 22050);   // decodeAudioData resamples to 22.05 kHz
  let ok = 0;
  for (const f of list) {
    MS.prog.current = msTitle(f); msRefreshStatus();
    try {
      const res = await fetch(`/stream/${f.id}`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const buf = await actx.decodeAudioData(await res.arrayBuffer());
      const feats = await msExtract(msWindow(buf), buf.sampleRate);
      feats.duration = Math.round(buf.duration);
      MS.feats[f.id] = feats; ok++;
    } catch (err) {
      console.warn('MoodSense could not analyse', f.name, err);
      MS.feats[f.id] = { error: true };
    }
    MS.prog.done++; MS.ver++;

  }
  MS.analyzing = false; MS.ver++;

// Lower the music while the AI is talking. Counted, so overlapping voices restore the right volume.
let _msDuckN = 0, _msDuckVol = 1, _msFade = null;
function msDuck(on) {
  if (on) {
    if (_msDuckN++ === 0 && !_msFade) { _msDuckVol = aud.volume; aud.volume = Math.min(aud.volume, Math.max(0.12, aud.volume * 0.35)); }
  } else if (_msDuckN > 0 && --_msDuckN === 0 && !_msFade) aud.volume = _msDuckVol;

  let started = false, ended = false;
  u.onstart = () => { started = true; msDuck(true); };

}

// Fade the music out, pause it and put the volume back.
function msFadeOut(ms = 4000) {
  clearInterval(_msFade); _msFade = null;

  const v0 = aud.volume, src = aud.src, t0 = performance.now();
  _msFade = setInterval(() => {
    let k = Math.min(1, (performance.now() - t0) / ms);
    if (aud.src !== src) k = 1;
    else aud.volume = v0 * (1 - k) * (1 - k);
    if (k >= 1) {

}

function msCalmFrame(now) {

    while (idx < s.phases.length - 1 && tIn >= s.phases[idx][1] * 1000) { tIn -= s.phases[idx][1] * 1000; idx++; }

function msChartTip(box, lines) {

}
function msPlaceTip(tip, x, y, W) {
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let tx = x + 14; if (tx + tw > W - 2) tx = x - tw - 14;
  tip.style.left = Math.max(2, tx) + 'px'; tip.style.top = Math.max(2, y - th / 2) + 'px';
}
function msLineChart(box, daily) {
  const W = Math.max(280, box.clientWidth), H = 210, L = 32, R = 34, T = 12, B = 26, iw = W - L - R, ih = H - T - B, n = daily.length;
  const x = i => L + i * iw / (n - 1), y = v => T + (1 - v / 100) * ih;
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart of your daily mood score for the last 14 days">`;
  for (const g of [0, 25, 50, 75, 100]) svg += `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" class="g"/><text x="${L - 7}" y="${y(g) + 3.5}" class="yl">${g}</text>`;
  daily.forEach((d, i) => {
    if ((n - 1 - i) % 2 === 0) svg += `<text x="${x(i)}" y="${H - 8}" class="xl">${i === n - 1 ? 'Today' : esc(new Date(d.t).toLocaleDateString([], { weekday: 'short' }))}</text>`;
  });
  let path = '', pen = false;
  daily.forEach((d, i) => { if (d.score == null) { pen = false; return; } path += `${pen ? 'L' : 'M'}${x(i).toFixed(1)} ${y(d.score).toFixed(1)}`; pen = true; });
  svg += `<line class="xh" x1="0" x2="0" y1="${T}" y2="${T + ih}" visibility="hidden"/><path d="${path}" class="ln"/>`;
  daily.forEach((d, i) => { if (d.score != null) svg += `<circle cx="${x(i)}" cy="${y(d.score)}" r="4" class="mk" data-i="${i}"/>`; });
  let li = -1; daily.forEach((d, i) => { if (d.score != null) li = i; });
  if (li >= 0) svg += `<text x="${x(li) + 9}" y="${y(daily[li].score) + 4}" class="dl">${daily[li].score}</text>`;
  const cw = iw / (n - 1);
  daily.forEach((d, i) => {
    const lab = `${msDayFmt(d.t)}: ${d.score == null ? 'no entries' : `mood score ${d.score}, ${d.n} entr${d.n === 1 ? 'y' : 'ies'}`}`;
    svg += `<rect class="hit" x="${x(i) - cw / 2}" y="${T}" width="${cw}" height="${ih}" tabindex="0" data-i="${i}" aria-label="${esc(lab)}"><title>${esc(lab)}</title></rect>`;
  });
  box.innerHTML = svg + '</svg><div class="ms-ctip" hidden></div>';
  const xh = box.querySelector('.xh'), tipEl = box.querySelector('.ms-ctip');
  const show = i => {
    const d = daily[i];
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('visibility', 'visible');
    box.querySelectorAll('.mk').forEach(m => m.setAttribute('r', +m.dataset.i === i ? 6 : 4));
    const lines = [msDayFmt(d.t), d.score == null ? 'No entries this day' : `Mood score ${d.score}`];
    if (d.n) lines.push(d.keys.map(k => `${MS_EMO[k] || ''} ${MS_FEEL[k] || k}`).join('  ·  '));
    msPlaceTip(msChartTip(box, lines), x(i), d.score == null ? T + ih / 2 : y(d.score), W);
  };
  const hide = () => { xh.setAttribute('visibility', 'hidden'); tipEl.hidden = true; box.querySelectorAll('.mk').forEach(m => m.setAttribute('r', 4)); };
  box.querySelectorAll('.hit').forEach(r => {
    const i = +r.dataset.i;
    r.addEventListener('mouseenter', () => show(i)); r.addEventListener('focus', () => show(i));
    r.addEventListener('mouseleave', hide); r.addEventListener('blur', hide);

function msDumbbell(box, rows) {
  const W = Math.max(280, box.clientWidth), RH = 34, T = 22, B = 4, L = 92, R = 42, iw = W - L - R, H = T + rows.length * RH + B;
  const x = v => L + v / 10 * iw;
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Anxiety before and after each Calm Coach session">`;
  for (let v = 0; v <= 10; v += 2) svg += `<line x1="${x(v)}" x2="${x(v)}" y1="${T - 4}" y2="${H - B}" class="g"/><text x="${x(v)}" y="12" class="xl">${v}</text>`;

  const tipEl = box.querySelector('.ms-ctip');

  box.querySelectorAll('.hit').forEach(r => {
    const i = +r.dataset.i;
    r.addEventListener('mouseenter', () => show(i)); r.addEventListener('focus', () => show(i));
    r.addEventListener('mouseleave', hide); r.addEventListener('blur', hide);
  });
}

// ── Emotion map (canvas) ──
function msAfterRender() {
  if (MS.calm.phase === 'session') msCalmEnsureLoop();
  if (MS.tab === 'journal') { msDrawCharts(); return; }
  if (MS.tab !== 'dj') return;
  const cv = document.getElementById('ms-map');
  if (cv) {
    cv.addEventListener('mousemove', msMapMove);
    cv.addEventListener('mouseleave', () => {
      MS.hover = null;
      const tip = document.getElementById('ms-tip'); if (tip) tip.hidden = true;
    });
    cv.addEventListener('click', () => { if (MS.hover) playFile(MS.hover); });
  }
  const chat = document.getElementById('ms-chat'); if (chat) chat.scrollTop = chat.scrollHeight;
  if (!MS.raf) MS.raf = requestAnimationFrame(msLoop);
}
function msLoop(time) {
  if (S.view !== 'mood' || MS.tab !== 'dj') { MS.raf = null; return; }
  msDrawMap(time || 0);
  MS.raf = requestAnimationFrame(msLoop);
}
function msMapMove(e) {
  const cv = e.currentTarget, r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  let best = null, bd = 14 * 14;
  for (const p of MS.mapPts) { const d = (p.x - mx) ** 2 + (p.y - my) ** 2; if (d < bd) { bd = d; best = p; } }
  MS.hover = best ? best.id : null;
  cv.style.cursor = best ? 'pointer' : 'crosshair';
  const tip = document.getElementById('ms-tip'); if (!tip) return;
  const pt = best && MS.byId[best.id], f = best && S.audio.find(x => x.id === best.id);
  if (!pt || !f) { tip.hidden = true; return; }
  const artist = (S.meta[f.id] || {}).artist, mood = MoodAI.MOODS[pt.mood];
  tip.innerHTML = `<b>${esc(msTitle(f))}</b>${artist ? `<span>${esc(artist)}</span><br>` : ''}` +
    `<span>${Math.round(pt.f.bpm)} BPM · ${esc(pt.f.key)} · energy ${pt.energy}%</span><br>` +
    `<span style="color:${mood.color}">${mood.label}</span> <span>· click to play</span>`;
  tip.hidden = false;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let tx = best.x + 14, ty = best.y - th - 10;
  if (tx + tw > r.width - 6) tx = best.x - tw - 14;
  if (ty < 6) ty = best.y + 14;
  tip.style.left = tx + 'px'; tip.style.top = ty + 'px';
}
function msDrawMap(time) {
  const cv = document.getElementById('ms-map'); if (!cv) return;
  msEnsure();
  const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const P = 30, X = v => P + v * (w - 2 * P), Y = a => P + (1 - a) * (h - 2 * P), M = MoodAI.MOODS;

  // Quadrants + labels
  for (const [k, v0, a0, v1, a1] of [['intense', 0, .5, .5, 1], ['hype', .5, .5, 1, 1], ['melancholy', 0, 0, .5, .5], ['chill', .5, 0, 1, .5]]) {
    g.fillStyle = M[k].color + '12';
    g.fillRect(X(v0), Y(a1), X(v1) - X(v0), Y(a0) - Y(a1));
    g.fillStyle = M[k].color + 'C0'; g.font = '600 11px Poppins, sans-serif';
    const left = v0 < .5, top = a0 >= .5;
    g.textAlign = left ? 'left' : 'right'; g.textBaseline = top ? 'top' : 'bottom';
    g.fillText(M[k].label.toUpperCase(), left ? X(0) + 10 : X(1) - 10, top ? Y(1) + 10 : Y(0) - 10);
  }
  // Axes
  g.strokeStyle = 'rgba(255,255,255,0.13)'; g.lineWidth = 1; g.setLineDash([4, 5]);
  g.beginPath(); g.moveTo(X(.5), Y(1)); g.lineTo(X(.5), Y(0)); g.moveTo(X(0), Y(.5)); g.lineTo(X(1), Y(.5)); g.stroke();
  g.setLineDash([]);
  g.fillStyle = 'rgba(255,255,255,0.45)'; g.font = '500 10px Poppins, sans-serif'; g.textAlign = 'center';
  g.textBaseline = 'top'; g.fillText('ENERGETIC', X(.5), 9);
  g.textBaseline = 'bottom'; g.fillText('CALM', X(.5), h - 8);
  g.textBaseline = 'middle';
  g.save(); g.translate(12, Y(.5)); g.rotate(-Math.PI / 2); g.fillText('SAD', 0, 0); g.restore();
  g.save(); g.translate(w - 12, Y(.5)); g.rotate(Math.PI / 2); g.fillText('HAPPY', 0, 0); g.restore();

  // Current mix: a mood journey is drawn as a route; any other mix as spokes from its goal
  const pathPts = MS.path ? MS.path.ids.map(id => MS.byId[id]).filter(Boolean) : [];
  if (pathPts.length > 1 && MS.path.ramp) {
    g.strokeStyle = 'rgba(255,255,255,0.5)'; g.lineWidth = 1.5; g.setLineDash([5, 5]); g.lineDashOffset = -(time / 50) % 10;
    g.beginPath(); pathPts.forEach((p, i) => i ? g.lineTo(X(p.v), Y(p.a)) : g.moveTo(X(p.v), Y(p.a))); g.stroke();
    g.setLineDash([]); g.lineDashOffset = 0;
  } else if (pathPts.length && MS.path.to) {
    const gx = X(MS.path.to.v), gy = Y(MS.path.to.a);
    g.strokeStyle = 'rgba(255,255,255,0.16)'; g.lineWidth = 1;
    g.beginPath(); for (const p of pathPts) { g.moveTo(gx, gy); g.lineTo(X(p.v), Y(p.a)); } g.stroke();
  }
  // Songs
  MS.mapPts = [];
  const playing = S.current && S.current.id;
  for (const p of MS.points) {
    const x = X(p.v), y = Y(p.a), c = M[p.mood].color, hov = MS.hover === p.id, on = playing === p.id;
    const r = on ? 8 + Math.sin(time / 260) * 1.6 : hov ? 8 : 5.5;
    g.beginPath(); g.arc(x, y, r, 0, TAU_MS);
    g.fillStyle = c; g.shadowColor = c; g.shadowBlur = on || hov ? 18 : 8; g.fill(); g.shadowBlur = 0;
    if (on) { g.lineWidth = 2; g.strokeStyle = '#fff'; g.stroke(); }
    MS.mapPts.push({ id: p.id, x, y });
  }
  // Numbered steps of the current mix
  g.font = '600 9px Poppins, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  pathPts.forEach((p, i) => {
    const x = X(p.v) + 9, y = Y(p.a) - 9;
    g.fillStyle = 'rgba(8,8,20,0.92)'; g.beginPath(); g.arc(x, y, 7, 0, TAU_MS); g.fill();
    g.fillStyle = '#fff'; g.fillText(String(i + 1), x, y + 0.5);
  });
  // You → Goal markers
  if (MS.path && MS.path.to) {
    g.strokeStyle = 'rgba(255,255,255,0.85)'; g.fillStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 1.5;
    g.font = '600 10px Poppins, sans-serif'; g.textBaseline = 'bottom';
    const tx = X(MS.path.to.v), ty = Y(MS.path.to.a), rr = 13 + Math.sin(time / 300) * 2;
    g.beginPath(); g.arc(tx, ty, rr, 0, TAU_MS); g.stroke();
    g.fillText('GOAL', tx, Math.max(14, ty - rr - 3));
    if (MS.path.ramp && MS.path.from) {
      const fx = X(MS.path.from.v), fy = Y(MS.path.from.a);
      g.setLineDash([2, 3]); g.beginPath(); g.arc(fx, fy, 10, 0, TAU_MS); g.stroke(); g.setLineDash([]);
      g.fillText('YOU', fx, Math.max(14, fy - 13));
    }
  }
}
const TAU_MS = Math.PI * 2;

// ══════════════════════════════════════════
init();
</script>
