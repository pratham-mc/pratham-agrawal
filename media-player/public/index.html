<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mediabox</title>
<style>
:root {
  --bg: #121212;
  --bg2: #1a1a1a;
  --surface: #242424;
  --surface2: #2a2a2a;
  --accent: #1DB954;
  --accent2: #1ed760;
  --text: #ffffff;
  --sub: #b3b3b3;
  --muted: #535353;
  --sidebar: 240px;
  --player-h: 92px;
  --radius: 8px;
  --ease: 0.2s ease;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html,body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  display: flex;
  flex-direction: column;
}

/* ── Layout ── */
.layout { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar);
  background: #000;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  flex-shrink: 0;
  padding-bottom: 1rem;
}
.logo {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 1.5rem 1.25rem 1rem;
  font-size: 1.25rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text);
  text-decoration: none;
}
.logo-bubble {
  width: 34px; height: 34px;
  background: var(--accent);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
  flex-shrink: 0;
}
.nav { padding: 0 0.5rem; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  padding: 0.65rem 0.85rem;
  border-radius: var(--radius);
  cursor: pointer;
  color: var(--sub);
  font-size: 0.875rem;
  font-weight: 600;
  transition: color var(--ease), background var(--ease);
  user-select: none;
}
.nav-item:hover { color: var(--text); background: rgba(255,255,255,0.05); }
.nav-item.active { color: var(--text); background: rgba(255,255,255,0.1); }
.nav-item .ni { font-size: 1.15rem; width: 22px; text-align: center; }
.sidebar-sep { height: 1px; background: #1e1e1e; margin: 0.6rem 1.2rem; }
.sidebar-section {
  padding: 0.6rem 1.25rem 0.25rem;
  font-size: 0.65rem; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--muted);
}
.pl-sidebar-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.55rem 0.85rem 0.55rem 1.35rem;
  border-radius: var(--radius);
  cursor: pointer;
  color: var(--sub);
  font-size: 0.82rem; font-weight: 600;
  transition: color var(--ease), background var(--ease);
  gap: 0.4rem;
}
.pl-sidebar-item:hover { color: var(--text); background: rgba(255,255,255,0.05); }
.pl-sidebar-item.active { color: var(--text); background: rgba(255,255,255,0.1); }
.pl-sidebar-item .pl-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.pl-sidebar-item .pl-del {
  opacity: 0; background: none; border: none;
  color: var(--muted); cursor: pointer;
  font-size: 0.75rem; padding: 0.15rem 0.3rem;
  border-radius: 4px; flex-shrink: 0;
  transition: opacity var(--ease), color var(--ease);
}
.pl-sidebar-item:hover .pl-del { opacity: 1; }
.pl-sidebar-item .pl-del:hover { color: #ff5555; }

/* ── Main ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.topbar {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.85rem 1.5rem;
  background: var(--bg);
  border-bottom: 1px solid #1e1e1e;
  flex-shrink: 0;
}
.search-wrap {
  display: flex;
  align-items: center;
  background: var(--surface);
  border-radius: 30px;
  padding: 0.5rem 1rem;
  gap: 0.5rem;
  flex: 1;
  max-width: 380px;
  transition: background var(--ease);
}
.search-wrap:focus-within { background: var(--surface2); outline: 2px solid var(--accent); }
.search-wrap input {
  background: none; border: none;
  color: var(--text); font-size: 0.875rem;
  outline: none; flex: 1;
}
.search-wrap input::placeholder { color: var(--muted); }
.topbar-spacer { flex: 1; }
.btn {
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 30px;
  padding: 0.55rem 1.25rem;
  font-size: 0.8rem;
  font-weight: 800;
  cursor: pointer;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  transition: background var(--ease), transform 0.1s;
}
.btn:hover { background: var(--accent2); transform: scale(1.02); }
.btn:active { transform: scale(0.98); }
.btn-ghost {
  background: transparent;
  color: var(--sub);
  border: 1px solid var(--muted);
  border-radius: 30px;
  padding: 0.55rem 1.1rem;
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: border-color var(--ease), color var(--ease);
}
.btn-ghost:hover { border-color: var(--text); color: var(--text); }
.content { flex: 1; overflow-y: auto; padding: 1.5rem; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #555; }

/* ── Section headings ── */
.sec-hd {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 1.1rem;
}
.sec-title { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; }
.sec-title.sm { font-size: 1.15rem; }
.sec-all {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--sub);
  cursor: pointer;
  transition: color var(--ease);
}
.sec-all:hover { color: var(--text); }

/* ── Music cards (square) ── */
.music-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
  gap: 1rem;
  margin-bottom: 2.5rem;
}
.music-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 1rem;
  cursor: pointer;
  transition: background var(--ease);
  position: relative;
}
.music-card:hover { background: var(--surface2); }
.mc-art {
  width: 100%; aspect-ratio: 1;
  border-radius: 4px;
  margin-bottom: 0.9rem;
  position: relative;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-size: 3rem;
}
.mc-art img {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
}
.mc-play {
  position: absolute;
  bottom: 0.5rem; right: 0.5rem;
  width: 44px; height: 44px;
  background: var(--accent);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
  color: #000;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.2s, transform 0.2s;
  box-shadow: 0 6px 20px rgba(0,0,0,0.5);
  z-index: 1;
}
.music-card:hover .mc-play { opacity: 1; transform: translateY(0); }
.mc-title {
  font-size: 0.875rem; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 0.2rem;
}
.mc-sub {
  font-size: 0.75rem; color: var(--sub);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ── Track list ── */
.track-header {
  display: grid;
  grid-template-columns: 2.5rem 2.5rem 1fr 6rem auto;
  gap: 0.75rem;
  padding: 0.4rem 0.75rem;
  border-bottom: 1px solid #282828;
  margin-bottom: 0.5rem;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.track-row {
  display: grid;
  grid-template-columns: 2.5rem 2.5rem 1fr 6rem auto;
  gap: 0.75rem;
  align-items: center;
  padding: 0.45rem 0.75rem;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s;
}
.track-row:hover { background: rgba(255,255,255,0.07); }
.track-row.playing { background: rgba(29,185,84,0.08); }
.track-row.playing .tr-name { color: var(--accent); }
.tr-num { font-size: 0.875rem; color: var(--sub); text-align: right; }
.tr-num .num { display: block; }
.tr-num .eq  { display: none; }
.track-row.playing .tr-num .num { display: none; }
.track-row.playing .tr-num .eq  { display: flex; }
.tr-art {
  width: 40px; height: 40px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; overflow: hidden; flex-shrink: 0;
}
.tr-art img { width: 100%; height: 100%; object-fit: cover; }
.tr-meta { overflow: hidden; }
.tr-name {
  font-size: 0.875rem; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tr-artist {
  font-size: 0.75rem; color: var(--sub);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tr-album {
  font-size: 0.8rem; color: var(--sub);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tr-dur { font-size: 0.8rem; color: var(--sub); text-align: right; }
.tr-dur-cell {
  display: flex; align-items: center; justify-content: flex-end; gap: 0.5rem;
}

/* context (⋯) button on track rows */
.ctx-btn {
  background: none; border: none;
  color: var(--muted); cursor: pointer;
  font-size: 1rem; padding: 0.15rem 0.35rem;
  border-radius: 4px; opacity: 0;
  transition: opacity var(--ease), color var(--ease);
  flex-shrink: 0;
}
.track-row:hover .ctx-btn { opacity: 1; }
.ctx-btn:hover { color: var(--text); background: rgba(255,255,255,0.08); }

/* equalizer bars */
.eq { display: flex; align-items: flex-end; gap: 2px; height: 18px; }
.eq span {
  display: block; width: 3px;
  background: var(--accent); border-radius: 1px;
  transform-origin: bottom;
}
@keyframes eq1 { 0%,100%{transform:scaleY(.2)} 50%{transform:scaleY(1)} }
@keyframes eq2 { 0%,100%{transform:scaleY(.5)} 50%{transform:scaleY(.3)} }
@keyframes eq3 { 0%,100%{transform:scaleY(.3)} 50%{transform:scaleY(.9)} }
.eq span:nth-child(1) { height:14px; animation:eq1 .8s ease-in-out infinite; }
.eq span:nth-child(2) { height:10px; animation:eq2 .8s ease-in-out .15s infinite; }
.eq span:nth-child(3) { height:14px; animation:eq3 .8s ease-in-out .3s infinite; }

/* ── Video grid ── */
.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.25rem;
  margin-bottom: 2rem;
}
.video-card {
  border-radius: var(--radius);
  cursor: pointer;
  overflow: hidden;
  background: var(--bg2);
  transition: transform var(--ease);
}
.video-card:hover { transform: translateY(-2px); }
.vc-thumb {
  width: 100%; aspect-ratio: 16/9;
  position: relative; overflow: hidden;
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-size: 3rem;
}
.vc-thumb video {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
}
.vc-overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.2s;
}
.video-card:hover .vc-overlay { opacity: 1; }
.vc-play {
  width: 54px; height: 54px;
  background: rgba(255,255,255,.92);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem;
  color: #000;
}
.vc-body { padding: 0.75rem; }
.vc-title {
  font-size: 0.875rem; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 0.2rem;
}
.vc-meta { font-size: 0.75rem; color: var(--sub); }

/* ── Player bar ── */
.player-bar {
  height: var(--player-h);
  background: #181818;
  border-top: 1px solid #282828;
  display: flex;
  align-items: center;
  padding: 0 1rem;
  gap: 0.75rem;
  flex-shrink: 0;
  z-index: 10;
}
.pl-left {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  width: 30%;
  min-width: 160px;
  overflow: hidden;
}
.pl-art {
  width: 56px; height: 56px;
  border-radius: 4px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem;
  overflow: hidden;
}
.pl-art img { width: 100%; height: 100%; object-fit: cover; }
.pl-info { overflow: hidden; flex: 1; }
.pl-title {
  font-size: 0.875rem; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pl-artist {
  font-size: 0.75rem; color: var(--sub);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pl-center {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center;
  gap: 0.45rem;
}
.pl-controls {
  display: flex; align-items: center; gap: 0.9rem;
}
.ctrl {
  background: none; border: none;
  color: var(--sub); cursor: pointer;
  font-size: 1.1rem; line-height: 1;
  padding: 0.2rem;
  display: flex; align-items: center; justify-content: center;
  transition: color var(--ease), transform 0.1s;
}
.ctrl:hover { color: var(--text); transform: scale(1.08); }
.ctrl.on { color: var(--accent); }
.ctrl.on:hover { color: var(--accent2); }
.pp-btn {
  width: 36px; height: 36px;
  background: var(--text);
  border: none; border-radius: 50%;
  color: #000; cursor: pointer;
  font-size: 0.9rem;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.1s, background 0.1s;
}
.pp-btn:hover { transform: scale(1.07); background: #fff; }
.progress-row {
  display: flex; align-items: center; gap: 0.5rem;
  width: 100%;
  font-size: 0.68rem; color: var(--sub);
}
.prog {
  flex: 1; height: 4px;
  background: #555;
  border-radius: 2px;
  cursor: pointer;
  position: relative;
  transition: height 0.1s;
}
.prog:hover { height: 6px; }
.prog-fill {
  height: 100%; background: var(--sub);
  border-radius: 2px; pointer-events: none;
  transition: background 0.15s;
}
.prog:hover .prog-fill { background: var(--accent); }
.prog-dot {
  position: absolute; top: 50%;
  width: 12px; height: 12px;
  background: var(--text);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  opacity: 0; pointer-events: none;
  transition: opacity 0.1s;
}
.prog:hover .prog-dot { opacity: 1; }
.pl-right {
  display: flex; align-items: center; gap: 0.6rem;
  width: 30%; min-width: 100px;
  justify-content: flex-end;
}
.vol-bar {
  width: 90px; height: 4px;
  background: #555;
  border-radius: 2px;
  cursor: pointer;
  position: relative;
  transition: height 0.1s;
}
.vol-bar:hover { height: 6px; }
.vol-fill { height: 100%; background: var(--sub); border-radius: 2px; pointer-events: none; }
.vol-bar:hover .vol-fill { background: var(--accent); }

/* ── Video modal ── */
.vid-modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.88);
  z-index: 200;
  display: none;
  align-items: center; justify-content: center;
  padding: 2rem;
  backdrop-filter: blur(6px);
}
.vid-modal.open { display: flex; }
.vid-inner {
  position: relative;
  width: 100%; max-width: 960px;
}
.vid-inner video {
  width: 100%; border-radius: 10px;
  background: #000;
  max-height: 80vh;
}
.vid-close {
  position: absolute; top: -2.2rem; right: 0;
  background: none; border: none;
  color: #fff; font-size: 1.5rem; cursor: pointer;
  opacity: 0.7; transition: opacity 0.2s;
}
.vid-close:hover { opacity: 1; }
.vid-label {
  margin-top: 0.75rem;
  font-size: 1rem; font-weight: 700;
  color: #fff; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ── Settings ── */
.settings-wrap { max-width: 580px; }
.stg-sub {
  font-size: 0.7rem; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--sub); margin-bottom: 0.75rem;
}
.stg-desc { font-size: 0.8rem; color: var(--sub); margin-bottom: 1rem; line-height: 1.6; }
.stg-desc code { color: var(--accent); font-family: monospace; }
.dir-row { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
.dir-input {
  flex: 1;
  background: var(--surface);
  border: 1px solid #333;
  border-radius: var(--radius);
  color: var(--text);
  padding: 0.7rem 1rem;
  font-size: 0.875rem; outline: none;
  transition: border-color var(--ease);
}
.dir-input:focus { border-color: var(--accent); }
.dir-item {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 0.7rem 1rem;
  margin-bottom: 0.4rem;
  font-size: 0.85rem;
}
.dir-path { color: var(--sub); overflow: hidden; text-overflow: ellipsis; }
.dir-del {
  background: none; border: none;
  color: var(--muted); cursor: pointer;
  font-size: 1rem; padding: 0.1rem 0.3rem;
  transition: color var(--ease);
}
.dir-del:hover { color: #ff5555; }
.stat-cards {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 0.75rem; margin-top: 0.75rem;
}
.stat-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 1.1rem 1.25rem;
}
.stat-num { font-size: 2rem; font-weight: 900; color: var(--accent); }
.stat-lbl { font-size: 0.8rem; color: var(--sub); margin-top: 0.2rem; }

/* ── Tabs ── */
.tabs { display: flex; gap: 0.4rem; margin-bottom: 1.25rem; }
.tab {
  padding: 0.45rem 1rem;
  border-radius: 30px;
  font-size: 0.8rem; font-weight: 700;
  cursor: pointer;
  background: var(--surface);
  color: var(--sub); border: none;
  transition: background var(--ease), color var(--ease);
}
.tab.active { background: var(--text); color: #000; }
.tab:hover:not(.active) { background: var(--surface2); color: var(--text); }

/* ── Empty state ── */
.empty {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 5rem 2rem; text-align: center; color: var(--sub);
}
.empty .ei { font-size: 4rem; margin-bottom: 1rem; }
.empty h3 { font-size: 1.25rem; font-weight: 800; margin-bottom: 0.5rem; color: var(--text); }
.empty p { font-size: 0.875rem; margin-bottom: 1.5rem; }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: calc(var(--player-h) + 1.25rem);
  left: 50%; transform: translateX(-50%);
  background: var(--surface2);
  color: var(--text);
  padding: 0.7rem 1.5rem;
  border-radius: var(--radius);
  font-size: 0.875rem; font-weight: 600;
  z-index: 300;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
  white-space: nowrap;
}
.toast.show { opacity: 1; }

/* ── Home quick-play row ── */
.quickplay-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.5rem;
  margin-bottom: 2rem;
}
@media (max-width: 900px) { .quickplay-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px) { .quickplay-grid { grid-template-columns: 1fr; } }
.qp-card {
  display: flex; align-items: center; gap: 0.75rem;
  background: rgba(255,255,255,.07);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: background var(--ease);
  height: 56px;
}
.qp-card:hover { background: rgba(255,255,255,.14); }
.qp-art {
  width: 56px; height: 56px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.25rem; overflow: hidden;
}
.qp-art img { width: 100%; height: 100%; object-fit: cover; }
.qp-name {
  font-size: 0.875rem; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding-right: 0.5rem;
}

/* ── Context menu ── */
.ctx-overlay { position: fixed; inset: 0; z-index: 499; display: none; }
.ctx-menu {
  position: fixed;
  background: var(--surface2);
  border-radius: var(--radius);
  box-shadow: 0 8px 30px rgba(0,0,0,0.7);
  z-index: 500; min-width: 190px;
  padding: 0.35rem 0;
  display: none;
}
.ctx-section {
  padding: 0.3rem 1rem 0.15rem;
  font-size: 0.65rem; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted);
}
.ctx-item {
  padding: 0.55rem 1rem;
  font-size: 0.85rem; cursor: pointer;
  color: var(--sub);
  transition: background var(--ease), color var(--ease);
  white-space: nowrap;
}
.ctx-item:hover { background: rgba(255,255,255,0.07); color: var(--text); }
.ctx-divider { height: 1px; background: #333; margin: 0.3rem 0; }

/* ── Playlist view ── */
.pl-header {
  display: flex; align-items: center; gap: 1.25rem; margin-bottom: 1.75rem;
}
.pl-cover {
  width: 80px; height: 80px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; flex-shrink: 0;
}
.pl-info-block { flex: 1; overflow: hidden; }
.pl-name-title {
  font-size: 1.6rem; font-weight: 800; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: color var(--ease);
}
.pl-name-title:hover { color: var(--accent); }
.pl-count { font-size: 0.8rem; color: var(--sub); margin-top: 0.2rem; }

/* playlist track row — last col holds reorder+remove buttons */
.pl-track-row {
  display: grid;
  grid-template-columns: 2.5rem 2.5rem 1fr 4.5rem auto;
  gap: 0.75rem;
  align-items: center;
  padding: 0.45rem 0.75rem;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s;
}
.pl-track-row:hover { background: rgba(255,255,255,0.07); }
.pl-track-row.playing { background: rgba(29,185,84,0.08); }
.pl-track-row.playing .tr-name { color: var(--accent); }
.tr-actions {
  display: flex; align-items: center; gap: 2px;
  opacity: 0; transition: opacity var(--ease);
}
.pl-track-row:hover .tr-actions { opacity: 1; }
.reorder-btn {
  background: none; border: none;
  color: var(--muted); cursor: pointer;
  font-size: 0.9rem; padding: 0.2rem 0.3rem;
  border-radius: 4px;
  transition: color var(--ease), background var(--ease);
  line-height: 1;
}
.reorder-btn:hover:not(:disabled) { color: var(--text); background: rgba(255,255,255,0.08); }
.reorder-btn:disabled { opacity: 0.2; cursor: default; }
.remove-btn {
  background: none; border: none;
  color: var(--muted); cursor: pointer;
  font-size: 0.85rem; padding: 0.2rem 0.3rem;
  border-radius: 4px;
  transition: color var(--ease), background var(--ease);
  line-height: 1;
}
.remove-btn:hover { color: #ff5555; background: rgba(255,85,85,0.1); }
</style>
</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="logo">
      <div class="logo-bubble">🎵</div>
      Mediabox
    </div>
    <div class="nav">
      <div class="nav-item active" data-view="home" onclick="navigate('home')">
        <span class="ni">⊞</span> Home
      </div>
      <div class="nav-item" data-view="music" onclick="navigate('music')">
        <span class="ni">♪</span> Music
      </div>
      <div class="nav-item" data-view="videos" onclick="navigate('videos')">
        <span class="ni">▶</span> Videos
      </div>
      <div class="sidebar-sep"></div>
      <div class="nav-item" data-view="settings" onclick="navigate('settings')">
        <span class="ni">⚙</span> Settings
      </div>
    </div>

    <div class="sidebar-sep" style="margin-top:.75rem"></div>
    <div class="sidebar-section">Your Playlists</div>
    <div class="nav" style="padding-bottom:0">
      <div class="nav-item" onclick="createPlaylist()" style="color:var(--sub)">
        <span class="ni" style="font-size:1.3rem;line-height:1;color:var(--accent)">+</span> New Playlist
      </div>
    </div>
    <div id="sidebar-playlists" style="padding:0 0.5rem"></div>
  </nav>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div class="search-wrap">
        <span style="color:var(--muted)">🔍</span>
        <input id="search" type="text" placeholder="Search songs, videos..." oninput="onSearch(this.value)">
      </div>
      <div class="topbar-spacer"></div>
      <button class="btn-ghost" id="scan-btn" onclick="rescan()">⟳ Refresh</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- Player bar -->
<div class="player-bar">
  <div class="pl-left">
    <div class="pl-art" id="pl-art">♪</div>
    <div class="pl-info">
      <div class="pl-title" id="pl-title">Select a track</div>
      <div class="pl-artist" id="pl-artist">–</div>
    </div>
  </div>
  <div class="pl-center">
    <div class="pl-controls">
      <button class="ctrl" id="shuf-btn" onclick="toggleShuffle()" title="Shuffle (S)">⇄</button>
      <button class="ctrl" onclick="prevTrack()" title="Previous (←)">⏮</button>
      <button class="pp-btn" id="pp-btn" onclick="togglePlay()" title="Play/Pause (Space)">▶</button>
      <button class="ctrl" onclick="nextTrack()" title="Next (→)">⏭</button>
      <button class="ctrl" id="rep-btn" onclick="toggleRepeat()" title="Repeat (R)">↻</button>
    </div>
    <div class="progress-row">
      <span id="cur-t">0:00</span>
      <div class="prog" id="prog" onclick="seekClick(event)">
        <div class="prog-fill" id="prog-fill" style="width:0%"></div>
        <div class="prog-dot" id="prog-dot" style="left:0%"></div>
      </div>
      <span id="tot-t">0:00</span>
    </div>
  </div>
  <div class="pl-right">
    <button class="ctrl" id="vol-icon" onclick="toggleMute()" title="Mute (M)">🔊</button>
    <div class="vol-bar" id="vol-bar" onclick="setVolClick(event)">
      <div class="vol-fill" id="vol-fill" style="width:100%"></div>
    </div>
  </div>
</div>

<!-- Video modal -->
<div class="vid-modal" id="vid-modal" onclick="if(event.target===this)closeVideo()">
  <div class="vid-inner">
    <button class="vid-close" onclick="closeVideo()">✕</button>
    <video id="vid-player" controls></video>
    <div class="vid-label" id="vid-label"></div>
  </div>
</div>

<!-- Context menu -->
<div class="ctx-overlay" id="ctx-overlay" onclick="closeCtx()"></div>
<div class="ctx-menu" id="ctx-menu"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<audio id="audio"></audio>

<script>
// ══════════════════════════════════════════
//  State
// ══════════════════════════════════════════
const S = {
  files: [], audio: [], video: [],
  playlists: [],
  activePlaylistId: null,
  current: null,
  queue: [], qi: -1,
  playing: false, shuffle: false, repeat: 'none',
  volume: 1, muted: false,
  view: 'home', q: '',
  meta: {}, dirs: [],
  musicTab: 'list',
};

const aud = document.getElementById('audio');
const vid = document.getElementById('vid-player');

// ══════════════════════════════════════════
//  Init
// ══════════════════════════════════════════
async function init() {
  restorePrefs();
  await loadPlaylists();
  renderSidebarPlaylists();
  await loadConfig();
  if (S.dirs.length) await scan(S.dirs);
  else render();
  wireAudio();
}

function restorePrefs() {
  try {
    const p = JSON.parse(localStorage.getItem('mb_prefs') || '{}');
    S.volume = p.vol ?? 1;
    S.shuffle = p.shuffle ?? false;
    S.repeat  = p.repeat ?? 'none';
  } catch(_) {}
  aud.volume = S.volume;
  syncVolUI();
  syncShuf();
  syncRep();
}

function savePrefs() {
  localStorage.setItem('mb_prefs', JSON.stringify({ vol: S.volume, shuffle: S.shuffle, repeat: S.repeat }));
}

async function loadConfig() {
  try {
    const d = await api('/api/config');
    S.dirs = d.directories || [];
  } catch(_) {}
}

async function saveConfig() {
  await api('/api/config', 'POST', { directories: S.dirs });
}

async function scan(dirs) {
  setBtn('Scanning…');
  try {
    const d = await api('/api/scan', 'POST', { directories: dirs });
    S.files = d.files || [];
    S.audio = S.files.filter(f => f.type === 'audio');
    S.video = S.files.filter(f => f.type === 'video');
    render();
    toast(`Found ${S.audio.length} songs · ${S.video.length} videos`);
    batchMeta(S.audio);
  } catch(_) {
    toast('Error scanning — check console');
  }
  setBtn('⟳ Refresh');
}

async function rescan() {
  if (!S.dirs.length) { navigate('settings'); toast('Add a folder first'); return; }
  await scan(S.dirs);
}

function setBtn(t) { document.getElementById('scan-btn').textContent = t; }

// ══════════════════════════════════════════
//  Metadata
// ══════════════════════════════════════════
async function batchMeta(files) {
  const todo = files.filter(f => !S.meta[f.id]);
  const SZ = 8;
  for (let i = 0; i < todo.length; i += SZ) {
    await Promise.all(todo.slice(i, i + SZ).map(fetchMeta));
    render();
  }
}

async function fetchMeta(f) {
  if (S.meta[f.id]) return S.meta[f.id];
  try {
    const d = await api(`/api/metadata/${f.id}`);
    S.meta[f.id] = d;
    if (S.current?.id === f.id) syncPlayerUI(S.current);
  } catch(_) {
    S.meta[f.id] = {};
  }
  return S.meta[f.id];
}

// ══════════════════════════════════════════
//  Navigation & Render
// ══════════════════════════════════════════
function navigate(v) {
  S.view = v;
  S.activePlaylistId = null;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === v));
  renderSidebarPlaylists();
  render();
}

function navigatePlaylist(id) {
  S.activePlaylistId = id;
  S.view = 'playlist';
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  renderSidebarPlaylists();
  render();
}

function onSearch(q) { S.q = q.toLowerCase(); render(); }

function filtered(arr) {
  if (!S.q) return arr;
  return arr.filter(f => {
    const m = S.meta[f.id] || {};
    return [f.name, m.title, m.artist, m.album].filter(Boolean).join(' ').toLowerCase().includes(S.q);
  });
}

function render() {
  const el = document.getElementById('content');
  if (S.view === 'home')     el.innerHTML = renderHome();
  if (S.view === 'music')    el.innerHTML = renderMusic();
  if (S.view === 'videos')   el.innerHTML = renderVideos();
  if (S.view === 'settings') el.innerHTML = renderSettings();
  if (S.view === 'playlist') el.innerHTML = renderPlaylistView();
}

// ── Home ──────────────────────────────────
function renderHome() {
  if (!S.files.length) return `
    <div class="empty">
      <div class="ei">🎵</div>
      <h3>Your library is empty</h3>
      <p>Add your Music and Videos folders to get started.</p>
      <button class="btn" onclick="navigate('settings')">Add Folders</button>
    </div>`;

  const tod = ['morning','afternoon','evening'][ new Date().getHours() < 12 ? 0 : new Date().getHours() < 18 ? 1 : 2 ];
  const qa = S.audio.slice(0, 6);
  const qv = S.video.slice(0, 4);

  return `
    <div class="sec-title" style="margin-bottom:1.5rem">Good ${tod} 👋</div>

    ${qa.length ? `
    <div class="quickplay-grid" style="margin-bottom:2rem">
      ${qa.map(f => {
        const m = S.meta[f.id] || {};
        const title = m.title || noExt(f.name);
        return `<div class="qp-card" onclick="playFile('${f.id}')">
          <div class="qp-art" style="background:${grad(f.id)}">
            ${m.hasArtwork ? `<img src="/api/artwork/${f.id}" onerror="this.remove()">` : '♪'}
          </div>
          <div class="qp-name">${esc(title)}</div>
        </div>`;
      }).join('')}
    </div>` : ''}

    ${qa.length ? `
    <div class="sec-hd">
      <div class="sec-title sm">Music</div>
      <div class="sec-all" onclick="navigate('music')">See all</div>
    </div>
    <div class="music-grid" style="margin-bottom:2.5rem">
      ${qa.map(f => musicCard(f)).join('')}
    </div>` : ''}

    ${qv.length ? `
    <div class="sec-hd">
      <div class="sec-title sm">Videos</div>
      <div class="sec-all" onclick="navigate('videos')">See all</div>
    </div>
    <div class="video-grid">
      ${qv.map(f => videoCard(f)).join('')}
    </div>` : ''}
  `;
}

// ── Music ─────────────────────────────────
function renderMusic() {
  if (!S.audio.length) return `
    <div class="empty">
      <div class="ei">🎵</div>
      <h3>No music found</h3>
      <p>Add folders with your music files in Settings.</p>
      <button class="btn" onclick="navigate('settings')">Add Folders</button>
    </div>`;

  const files = filtered(S.audio);
  return `
    <div class="sec-hd">
      <div class="sec-title">Music Library</div>
      <div style="font-size:.8rem;color:var(--sub)">${files.length} songs</div>
    </div>
    <div class="tabs">
      <button class="tab ${S.musicTab==='list'?'active':''}" onclick="setMusicTab('list',this)">List</button>
      <button class="tab ${S.musicTab==='grid'?'active':''}" onclick="setMusicTab('grid',this)">Grid</button>
    </div>
    <div id="music-body">
      ${S.musicTab === 'list' ? trackList(files) : musicGrid(files)}
    </div>`;
}

function setMusicTab(t, btn) {
  S.musicTab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('music-body').innerHTML =
    t === 'list' ? trackList(filtered(S.audio)) : musicGrid(filtered(S.audio));
}

function musicGrid(files) {
  if (!files.length) return '<div class="empty"><p>No results</p></div>';
  return `<div class="music-grid">${files.map(f => musicCard(f)).join('')}</div>`;
}

function musicCard(f) {
  const m = S.meta[f.id] || {};
  const title = m.title || noExt(f.name);
  const artist = m.artist || 'Unknown Artist';
  const isCur = S.current?.id === f.id;
  return `
    <div class="music-card${isCur?' playing':''}" onclick="playFile('${f.id}')">
      <div class="mc-art" style="background:${grad(f.id)}">
        ${m.hasArtwork ? `<img src="/api/artwork/${f.id}" onerror="this.remove()">` : '♪'}
        <div class="mc-play">▶</div>
      </div>
      <div class="mc-title">${esc(title)}</div>
      <div class="mc-sub">${esc(artist)}</div>
    </div>`;
}

function trackList(files) {
  if (!files.length) return '<div class="empty"><p>No results</p></div>';
  return `
    <div class="track-header">
      <div>#</div>
      <div></div>
      <div>Title</div>
      <div>Album</div>
      <div>⏱</div>
    </div>
    <div>
    ${files.map((f, i) => {
      const m = S.meta[f.id] || {};
      const title  = m.title  || noExt(f.name);
      const artist = m.artist || 'Unknown Artist';
      const album  = m.album  || '';
      const dur    = m.duration ? fmtTime(m.duration) : '–';
      const isCur  = S.current?.id === f.id;
      return `
        <div class="track-row${isCur?' playing':''}" onclick="playFile('${f.id}', ${i})">
          <div class="tr-num">
            <span class="num">${i+1}</span>
            <div class="eq">
              <span></span><span></span><span></span>
            </div>
          </div>
          <div class="tr-art" style="background:${grad(f.id)}">
            ${m.hasArtwork ? `<img src="/api/artwork/${f.id}" onerror="this.remove()">` : '♪'}
          </div>
          <div class="tr-meta">
            <div class="tr-name">${esc(title)}</div>
            <div class="tr-artist">${esc(artist)}</div>
          </div>
          <div class="tr-album">${esc(album)}</div>
          <div class="tr-dur-cell">
            <span class="tr-dur">${dur}</span>
            <button class="ctx-btn" onclick="event.stopPropagation();showCtx(event,'${f.id}')" title="Options">⋯</button>
          </div>
        </div>`;
    }).join('')}
    </div>`;
}

// ── Videos ────────────────────────────────
function renderVideos() {
  if (!S.video.length) return `
    <div class="empty">
      <div class="ei">🎬</div>
      <h3>No videos found</h3>
      <p>Add folders with your video files in Settings.</p>
      <button class="btn" onclick="navigate('settings')">Add Folders</button>
    </div>`;

  const files = filtered(S.video);
  return `
    <div class="sec-hd">
      <div class="sec-title">Video Library</div>
      <div style="font-size:.8rem;color:var(--sub)">${files.length} videos</div>
    </div>
    <div class="video-grid">
      ${files.map(f => videoCard(f)).join('')}
    </div>`;
}

function videoCard(f) {
  const title = noExt(f.name);
  return `
    <div class="video-card" onclick="openVideo('${f.id}','${esc(title).replace(/'/g,'\\&#39;')}')">
      <div class="vc-thumb" style="background:${grad(f.id)}">
        <video src="/stream/${f.id}#t=5" preload="metadata" muted playsinline
               style="width:100%;height:100%;object-fit:cover"
               onerror="this.style.display='none'"></video>
        <div class="vc-overlay"><div class="vc-play">▶</div></div>
      </div>
      <div class="vc-body">
        <div class="vc-title">${esc(title)}</div>
        <div class="vc-meta">${fmtSize(f.size)}</div>
      </div>
    </div>`;
}

// ── Settings ──────────────────────────────
function renderSettings() {
  return `
    <div class="settings-wrap">
      <div class="sec-title" style="margin-bottom:1.5rem">Settings</div>

      <div class="stg-sub">Media Folders</div>
      <div class="stg-desc">
        Add folders where your music and videos are stored.<br>
        Examples: <code>/home/user/Music</code> · <code>C:\\Users\\User\\Downloads</code>
      </div>

      <div class="dir-row">
        <input class="dir-input" id="dir-in" type="text" placeholder="/home/user/Music"
               onkeydown="if(event.key==='Enter')addDir()">
        <button class="btn" onclick="addDir()">Add</button>
      </div>

      <div id="dir-list">
        ${S.dirs.length ? S.dirs.map((d,i) => `
          <div class="dir-item">
            <span class="dir-path">📁 ${esc(d)}</span>
            <button class="dir-del" onclick="removeDir(${i})" title="Remove">✕</button>
          </div>`).join('') : '<p style="color:var(--muted);font-size:.85rem;padding:.25rem 0">No folders added yet.</p>'}
      </div>

      ${S.dirs.length ? `<button class="btn" style="margin-top:1.25rem" onclick="rescan()">Scan Now</button>` : ''}

      <div style="margin-top:3rem">
        <div class="stg-sub">Library Stats</div>
        <div class="stat-cards">
          <div class="stat-card"><div class="stat-num">${S.audio.length}</div><div class="stat-lbl">Songs</div></div>
          <div class="stat-card"><div class="stat-num">${S.video.length}</div><div class="stat-lbl">Videos</div></div>
        </div>
      </div>

      <div style="margin-top:3rem">
        <div class="stg-sub">Keyboard Shortcuts</div>
        <div style="font-size:.8rem;color:var(--sub);line-height:2">
          <b style="color:var(--text)">Space</b> — Play / Pause &nbsp;·&nbsp;
          <b style="color:var(--text)">← →</b> — Seek 10 s &nbsp;·&nbsp;
          <b style="color:var(--text)">Alt + ← →</b> — Prev / Next track<br>
          <b style="color:var(--text)">S</b> — Shuffle &nbsp;·&nbsp;
          <b style="color:var(--text)">R</b> — Repeat &nbsp;·&nbsp;
          <b style="color:var(--text)">M</b> — Mute &nbsp;·&nbsp;
          <b style="color:var(--text)">Esc</b> — Close video
        </div>
      </div>
    </div>`;
}

function addDir() {
  const v = document.getElementById('dir-in').value.trim();
  if (!v) return;
  if (S.dirs.includes(v)) { toast('Already added'); return; }
  S.dirs.push(v);
  saveConfig();
  render();
}

function removeDir(i) {
  S.dirs.splice(i, 1);
  saveConfig();
  render();
}

// ── Playlist view ──────────────────────────
function renderPlaylistView() {
  const pl = S.playlists.find(p => p.id === S.activePlaylistId);
  if (!pl) return `<div class="empty"><div class="ei">♫</div><h3>Playlist not found</h3></div>`;

  const tracks = pl.tracks.map(id => S.files.find(f => f.id === id)).filter(Boolean);

  return `
    <div class="pl-header">
      <div class="pl-cover" style="background:${grad(pl.id)}">♫</div>
      <div class="pl-info-block">
        <div class="pl-name-title" onclick="renamePlaylist('${pl.id}')" title="Click to rename">${esc(pl.name)}</div>
        <div class="pl-count">${tracks.length} song${tracks.length !== 1 ? 's' : ''}</div>
      </div>
      ${tracks.length ? `<button class="btn" onclick="playPlaylist('${pl.id}')">▶ Play All</button>` : ''}
    </div>

    ${!tracks.length ? `
      <div class="empty" style="padding:3rem 2rem">
        <div class="ei">🎵</div>
        <h3>This playlist is empty</h3>
        <p>Go to Music, hover a song, and click ⋯ to add it here.</p>
        <button class="btn" onclick="navigate('music')">Browse Music</button>
      </div>` : `
      <div class="track-header" style="grid-template-columns:2.5rem 2.5rem 1fr 4.5rem auto">
        <div>#</div><div></div><div>Title</div><div>⏱</div><div></div>
      </div>
      <div>
      ${tracks.map((f, i) => {
        const m = S.meta[f.id] || {};
        const title  = m.title  || noExt(f.name);
        const artist = m.artist || 'Unknown Artist';
        const dur    = m.duration ? fmtTime(m.duration) : '–';
        const isCur  = S.current?.id === f.id;
        return `
          <div class="pl-track-row${isCur?' playing':''}" onclick="playPlaylistTrack('${pl.id}',${i})">
            <div class="tr-num">
              <span class="num">${i+1}</span>
              <div class="eq"><span></span><span></span><span></span></div>
            </div>
            <div class="tr-art" style="background:${grad(f.id)}">
              ${m.hasArtwork ? `<img src="/api/artwork/${f.id}" onerror="this.remove()">` : '♪'}
            </div>
            <div class="tr-meta">
              <div class="tr-name">${esc(title)}</div>
              <div class="tr-artist">${esc(artist)}</div>
            </div>
            <div class="tr-dur">${dur}</div>
            <div class="tr-actions" onclick="event.stopPropagation()">
              <button class="reorder-btn" onclick="moveInPlaylist('${pl.id}',${i},-1)"
                      ${i===0?'disabled':''} title="Move up">↑</button>
              <button class="reorder-btn" onclick="moveInPlaylist('${pl.id}',${i},1)"
                      ${i===tracks.length-1?'disabled':''} title="Move down">↓</button>
              <button class="remove-btn" onclick="removeFromPlaylist('${pl.id}','${f.id}')"
                      title="Remove from playlist">✕</button>
            </div>
          </div>`;
      }).join('')}
      </div>
    `}`;
}

// ══════════════════════════════════════════
//  Playlist management
// ══════════════════════════════════════════
async function loadPlaylists() {
  try {
    const d = await api('/api/playlists');
    S.playlists = d.playlists || [];
  } catch(_) { S.playlists = []; }
}

function savePlaylists() {
  api('/api/playlists', 'POST', { playlists: S.playlists }).catch(() => {});
}

function renderSidebarPlaylists() {
  const el = document.getElementById('sidebar-playlists');
  if (!el) return;
  el.innerHTML = S.playlists.map(pl => `
    <div class="pl-sidebar-item ${S.activePlaylistId===pl.id&&S.view==='playlist'?'active':''}"
         onclick="navigatePlaylist('${pl.id}')">
      <span class="pl-name">♫ ${esc(pl.name)}</span>
      <button class="pl-del" onclick="deletePlaylist('${pl.id}',event)" title="Delete playlist">✕</button>
    </div>`).join('');
}

function createPlaylist(prefillFileId) {
  const name = prompt('Playlist name:');
  if (!name?.trim()) return;
  const pl = { id: Date.now().toString(), name: name.trim(), tracks: [] };
  if (prefillFileId) pl.tracks.push(prefillFileId);
  S.playlists.push(pl);
  savePlaylists();
  renderSidebarPlaylists();
  if (prefillFileId) toast(`Added to "${pl.name}"`);
  else navigatePlaylist(pl.id);
}

function deletePlaylist(id, e) {
  e.stopPropagation();
  const pl = S.playlists.find(p => p.id === id);
  if (!pl) return;
  if (!confirm(`Delete playlist "${pl.name}"?`)) return;
  S.playlists = S.playlists.filter(p => p.id !== id);
  savePlaylists();
  if (S.activePlaylistId === id) { S.activePlaylistId = null; navigate('music'); }
  else renderSidebarPlaylists();
}

function renamePlaylist(id) {
  const pl = S.playlists.find(p => p.id === id);
  if (!pl) return;
  const name = prompt('Rename playlist:', pl.name);
  if (!name?.trim() || name.trim() === pl.name) return;
  pl.name = name.trim();
  savePlaylists();
  renderSidebarPlaylists();
  render();
}

function addToPlaylist(plId, fileId) {
  const pl = S.playlists.find(p => p.id === plId);
  if (!pl) return;
  if (pl.tracks.includes(fileId)) { toast('Already in this playlist'); return; }
  pl.tracks.push(fileId);
  savePlaylists();
  if (S.activePlaylistId === plId) render();
  toast(`Added to "${pl.name}"`);
}

function removeFromPlaylist(plId, fileId) {
  const pl = S.playlists.find(p => p.id === plId);
  if (!pl) return;
  pl.tracks = pl.tracks.filter(id => id !== fileId);
  savePlaylists();
  render();
}

function moveInPlaylist(plId, idx, dir) {
  const pl = S.playlists.find(p => p.id === plId);
  if (!pl) return;
  const ni = idx + dir;
  if (ni < 0 || ni >= pl.tracks.length) return;
  [pl.tracks[idx], pl.tracks[ni]] = [pl.tracks[ni], pl.tracks[idx]];
  savePlaylists();
  render();
}

function playPlaylist(plId) {
  const pl = S.playlists.find(p => p.id === plId);
  if (!pl || !pl.tracks.length) return;
  const tracks = pl.tracks.map(id => S.files.find(f => f.id === id)).filter(Boolean);
  if (!tracks.length) return;
  S.queue = tracks;
  S.qi = 0;
  const f = tracks[0];
  S.current = f;
  aud.src = `/stream/${f.id}`;
  aud.play();
  S.playing = true;
  syncPlayerUI(f);
  render();
  if (!S.meta[f.id]) fetchMeta(f);
}

function playPlaylistTrack(plId, idx) {
  const pl = S.playlists.find(p => p.id === plId);
  if (!pl) return;
  const tracks = pl.tracks.map(id => S.files.find(f => f.id === id)).filter(Boolean);
  const f = tracks[idx];
  if (!f) return;
  S.queue = tracks;
  S.qi = idx;
  S.current = f;
  aud.src = `/stream/${f.id}`;
  aud.play();
  S.playing = true;
  syncPlayerUI(f);
  render();
  if (!S.meta[f.id]) fetchMeta(f);
}

// ══════════════════════════════════════════
//  Context menu
// ══════════════════════════════════════════
function showCtx(e, fileId) {
  const menu = document.getElementById('ctx-menu');
  const overlay = document.getElementById('ctx-overlay');

  const plItems = S.playlists.length
    ? S.playlists.map(pl => `<div class="ctx-item" onclick="closeCtx();addToPlaylist('${pl.id}','${fileId}')">♫ ${esc(pl.name)}</div>`).join('')
    : `<div class="ctx-item" style="color:var(--muted);cursor:default;font-size:.8rem">No playlists yet</div>`;

  menu.innerHTML = `
    <div class="ctx-section">Add to playlist</div>
    ${plItems}
    <div class="ctx-divider"></div>
    <div class="ctx-item" onclick="closeCtx();createPlaylist('${fileId}')">+ New playlist…</div>
  `;

  const x = Math.min(e.clientX, window.innerWidth - 210);
  const y = Math.min(e.clientY, window.innerHeight - menu.scrollHeight - 20);
  menu.style.left = x + 'px';
  menu.style.top  = y + 'px';
  menu.style.display = 'block';
  overlay.style.display = 'block';
}

function closeCtx() {
  document.getElementById('ctx-menu').style.display = 'none';
  document.getElementById('ctx-overlay').style.display = 'none';
}

// ══════════════════════════════════════════
//  Playback — Audio
// ══════════════════════════════════════════
function playFile(id, listIdx) {
  const f = S.files.find(x => x.id === id);
  if (!f) return;

  if (f.type === 'video') { openVideo(id, noExt(f.name)); return; }

  S.current = f;
  const pool = filtered(S.audio);
  S.queue = pool;
  S.qi = listIdx != null ? listIdx : pool.findIndex(x => x.id === id);
  if (S.qi < 0) S.qi = 0;

  aud.src = `/stream/${id}`;
  aud.play();
  S.playing = true;
  syncPlayerUI(f);
  render();

  if (!S.meta[id]) fetchMeta(f);
}

function togglePlay() {
  if (!S.current) return;
  if (aud.paused) aud.play(); else aud.pause();
}

function nextTrack() {
  if (!S.queue.length) return;
  let ni;
  if (S.shuffle) ni = Math.floor(Math.random() * S.queue.length);
  else { ni = S.qi + 1; if (ni >= S.queue.length) { if (S.repeat==='all') ni=0; else return; } }
  S.qi = ni;
  playFile(S.queue[ni].id, ni);
}

function prevTrack() {
  if (!S.queue.length) return;
  if (aud.currentTime > 3) { aud.currentTime = 0; return; }
  let pi = S.qi - 1;
  if (pi < 0) pi = S.repeat==='all' ? S.queue.length-1 : 0;
  S.qi = pi;
  playFile(S.queue[pi].id, pi);
}

function toggleShuffle() {
  S.shuffle = !S.shuffle;
  syncShuf(); savePrefs();
}

function toggleRepeat() {
  S.repeat = {none:'all',all:'one',one:'none'}[S.repeat];
  syncRep(); savePrefs();
}

function toggleMute() {
  S.muted = !S.muted;
  aud.muted = S.muted;
  document.getElementById('vol-icon').textContent = S.muted ? '🔇' : S.volume < .5 ? '🔉' : '🔊';
}

function seekClick(e) {
  const b = document.getElementById('prog').getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - b.left) / b.width));
  if (aud.duration) aud.currentTime = pct * aud.duration;
}

function setVolClick(e) {
  const b = document.getElementById('vol-bar').getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - b.left) / b.width));
  S.volume = pct; aud.volume = pct;
  S.muted = pct === 0; aud.muted = S.muted;
  document.getElementById('vol-icon').textContent = pct===0 ? '🔇' : pct<.5 ? '🔉' : '🔊';
  syncVolUI(); savePrefs();
}

function wireAudio() {
  aud.addEventListener('timeupdate', () => {
    if (!aud.duration) return;
    const p = (aud.currentTime / aud.duration) * 100;
    document.getElementById('prog-fill').style.width = p + '%';
    document.getElementById('prog-dot').style.left  = p + '%';
    document.getElementById('cur-t').textContent = fmtTime(aud.currentTime);
  });
  aud.addEventListener('loadedmetadata', () => {
    document.getElementById('tot-t').textContent = fmtTime(aud.duration);
  });
  aud.addEventListener('play',  () => { S.playing=true;  syncPP(); });
  aud.addEventListener('pause', () => { S.playing=false; syncPP(); });
  aud.addEventListener('ended', () => {
    if (S.repeat==='one') { aud.currentTime=0; aud.play(); } else nextTrack();
  });
  aud.addEventListener('error', () => { toast('Error playing file'); nextTrack(); });
}

// ── Sync UI helpers ───────────────────────
function syncPlayerUI(f) {
  const m = S.meta[f.id] || {};
  document.getElementById('pl-title').textContent  = m.title  || noExt(f.name);
  document.getElementById('pl-artist').textContent = m.artist || '–';
  const artEl = document.getElementById('pl-art');
  if (m.hasArtwork) {
    artEl.innerHTML = `<img src="/api/artwork/${f.id}" onerror="this.parentElement.innerHTML='♪';this.parentElement.style.background='${grad(f.id)}'">`;
    artEl.style.background = '';
    artEl.style.fontSize = '';
  } else {
    artEl.innerHTML = '♪';
    artEl.style.background = grad(f.id);
    artEl.style.fontSize = '1.5rem';
  }
  syncPP();
}

function syncPP() {
  document.getElementById('pp-btn').textContent = S.playing ? '⏸' : '▶';
}

function syncShuf() {
  document.getElementById('shuf-btn').classList.toggle('on', S.shuffle);
}

function syncRep() {
  const b = document.getElementById('rep-btn');
  b.classList.toggle('on', S.repeat !== 'none');
  b.textContent = S.repeat === 'one' ? '↺¹' : '↻';
  b.title = {none:'Repeat',all:'Repeat All',one:'Repeat One'}[S.repeat];
}

function syncVolUI() {
  document.getElementById('vol-fill').style.width = (S.volume * 100) + '%';
}

// ══════════════════════════════════════════
//  Video modal
// ══════════════════════════════════════════
function openVideo(id, title) {
  aud.pause();
  vid.src = `/stream/${id}`;
  document.getElementById('vid-label').textContent = title;
  document.getElementById('vid-modal').classList.add('open');
  vid.play();
}

function closeVideo() {
  vid.pause(); vid.src = '';
  document.getElementById('vid-modal').classList.remove('open');
}

// ══════════════════════════════════════════
//  Keyboard shortcuts
// ══════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space')     { e.preventDefault(); togglePlay(); }
  if (e.code === 'KeyS')      toggleShuffle();
  if (e.code === 'KeyR')      toggleRepeat();
  if (e.code === 'KeyM')      toggleMute();
  if (e.code === 'Escape')    { closeVideo(); closeCtx(); }
  if (e.code === 'ArrowRight' && e.altKey)  nextTrack();
  if (e.code === 'ArrowLeft'  && e.altKey)  prevTrack();
  if (e.code === 'ArrowRight' && !e.altKey && aud.duration) aud.currentTime = Math.min(aud.duration, aud.currentTime+10);
  if (e.code === 'ArrowLeft'  && !e.altKey && aud.duration) aud.currentTime = Math.max(0, aud.currentTime-10);
});

// ══════════════════════════════════════════
//  Utilities
// ══════════════════════════════════════════
async function api(url, method='GET', body) {
  const opts = { method, headers: {} };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(url, opts);
  return r.json();
}

let toastTmr;
function toast(msg, ms=3000) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTmr);
  toastTmr = setTimeout(() => el.classList.remove('show'), ms);
}

function fmtTime(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

function fmtSize(b) {
  if (!b) return '';
  if (b < 1e6)  return (b/1e3).toFixed(1)+' KB';
  if (b < 1e9)  return (b/1e6).toFixed(1)+' MB';
  return (b/1e9).toFixed(1)+' GB';
}

function noExt(n) { return n.replace(/\.[^/.]+$/, ''); }

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function grad(s) {
  const palettes = [
    ['#FF6B6B','#4ECDC4'],['#667eea','#764ba2'],['#f093fb','#f5576c'],
    ['#4facfe','#00f2fe'],['#43e97b','#38f9d7'],['#fa709a','#fee140'],
    ['#a18cd1','#fbc2eb'],['#ff9a9e','#fad0c4'],['#a1c4fd','#c2e9fb'],
    ['#d4fc79','#96e6a1'],['#30cfd0','#667eea'],['#f7971e','#ffd200'],
  ];
  let h = 0;
  for (let i = 0; i < s.length; i++) h = s.charCodeAt(i) + ((h<<5)-h);
  const [c1,c2] = palettes[Math.abs(h) % palettes.length];
  return `linear-gradient(135deg,${c1},${c2})`;
}

// ══════════════════════════════════════════
init();
</script>
